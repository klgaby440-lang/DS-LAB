<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | DS-LAB</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Couleur de fond unique pour le Neumorphism */
        body {
            background-color: #e0e5ec;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .neu-form-container {
            width: 400px;
            padding: 40px;
            border-radius: 30px;
            /* Ombre externe pour faire ressortir le bloc */
            box-shadow: 9px 9px 16px rgb(163,177,198,0.6), -9px -9px 16px rgba(255,255,255, 0.5);
        }

        .neu-form-container h2 {
            text-align: center;
            color: #4a5568;
            margin-bottom: 30px;
            font-size: 2rem;
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 25px;
        }

        .input-group label {
            display: block;
            margin-bottom: 10px;
            color: #718096;
            font-weight: bold;
            padding-left: 5px;
        }

        /* Les champs de saisie creusés dans la matière */
        .neu-input {
            width: 100%;
            padding: 15px;
            border: none;
            outline: none;
            background-color: #e0e5ec;
            border-radius: 15px;
            font-size: 1rem;
            color: #4a5568;
            /* Ombre interne pour l'effet de creux */
            box-shadow: inset 6px 6px 10px 0 rgba(163,177,198, 0.7), inset -6px -6px 10px 0 rgba(255,255,255, 0.8);
        }

        /* Le bouton en relief */
        .neu-button {
            width: 100%;
            padding: 15px;
            border: none;
            outline: none;
            background-color: #e0e5ec;
            border-radius: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #4a5568;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            /* Ombre externe pour l'effet bouton surélevé */
            box-shadow: 6px 6px 10px 0 rgba(163,177,198, 0.7), -6px -6px 10px 0 rgba(255,255,255, 0.8);
        }

        /* Quand on clique sur le bouton, il s'enfonce */
        .neu-button:active {
            box-shadow: inset 6px 6px 10px 0 rgba(163,177,198, 0.7), inset -6px -6px 10px 0 rgba(255,255,255, 0.8);
            color: #2b6cb0;
        }
    </style>
</head>
<body>

    <div class="neu-form-container">
        <h2>CONTACTER DS-LAB</h2>
        <form action="#" method="POST">
            
            <div class="input-group">
                <label for="name">Nom du client ou entreprise</label>
                <input type="text" id="name" class="neu-input" placeholder="Ex: Jean Dupont">
            </div>

            <div class="input-group">
                <label for="email">Adresse E-mail</label>
                <input type="email" id="email" class="neu-input" placeholder="contact@email.com">
            </div>

            <div class="input-group">
                <label for="message">Besoin technique</label>
                <textarea id="message" class="neu-input" rows="4" placeholder="Description de votre projet web ou logiciel..."></textarea>
            </div>

            <button type="submit" class="neu-button">Envoyer la requête</button>

        </form>
    </div>

</body>
</html>
