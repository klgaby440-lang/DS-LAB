<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 360 320'><rect width='360' height='320' fill='%230D0E12' rx='40'/><g transform='translate(-110, -10)'><path d='M 195 280 C 180 300 215 305 230 275 L 390 110 C 435 60 475 35 450 25 C 420 30 375 70 197 278' fill='none' stroke='%23FFFFFF' stroke-width='14' stroke-linecap='round' stroke-linejoin='round'/><path d='M 130 130 L 470 130' fill='none' stroke='%23FFFFFF' stroke-width='14' stroke-linecap='round'/><path d='M 230 130 L 230 280' fill='none' stroke='%23FFFFFF' stroke-width='14' stroke-linecap='round'/><path d='M 350 130 L 350 270 Q 350 285 365 285' fill='none' stroke='%23FFFFFF' stroke-width='14' stroke-linecap='round'/><circle cx='245' cy='260' r='22' fill='%232e3030'/></g></svg>">
    <title>Dashboard Analyse | CRYPT</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Courier New", Courier, monospace;
        }

        body {
            background-color: #050a15;
            color: #ffffff;
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background-color: #0b132b;
            padding: 30px 20px;
            border-right: 2px solid #00f3ff;
            box-shadow: 2px 0 15px rgba(0, 243, 255, 0.2);
        }

        .sidebar h2 {
            color: #00f3ff;
            text-shadow: 0 0 10px #00f3ff;
            margin-bottom: 40px;
            font-size: 1.3rem;
        }

        .sidebar ul {
            list-style: none;
        }

        .sidebar ul li {
            margin-bottom: 20px;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 1px;
            transition: color 0.3s, text-shadow 0.3s;
            font-size: 0.95rem;
        }

        .sidebar ul li:hover {
            color: #b026ff;
            text-shadow: 0 0 10px #b026ff;
        }

        /* Dashboard Main */
        .dashboard {
            flex-grow: 1;
            padding: 40px;
        }

        .dashboard-header {
            margin-bottom: 40px;
        }

        .dashboard-header h1 {
            color: #b026ff;
            text-shadow: 0 0 15px #b026ff;
            font-size: 2.2rem;
            margin-bottom: 5px;
        }

        .dashboard-header p {
            color: #8da2c0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 25px;
        }

        /* Néon Boxes */
        .neon-box {
            background-color: #111a30;
            border: 1px solid #00f3ff;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.3), inset 0 0 10px rgba(0, 243, 255, 0.1);
            text-align: center;
        }

        .neon-box.purple {
            border-color: #b026ff;
            box-shadow: 0 0 10px rgba(176, 38, 255, 0.3), inset 0 0 10px rgba(176, 38, 255, 0.1);
        }

        .neon-box.green {
            border-color: #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.3), inset 0 0 10px rgba(0, 255, 136, 0.1);
        }

        .neon-box h3 {
            font-size: 1.1rem;
            color: #8da2c0;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .neon-box .data {
            font-size: 2.5rem;
            font-weight: bold;
            color: #00f3ff;
            text-shadow: 0 0 10px #00f3ff;
        }

        .neon-box.purple .data {
            color: #b026ff;
            text-shadow: 0 0 10px #b026ff;
        }

        .neon-box.green .data {
            color: #00ff88;
            text-shadow: 0 0 10px #00ff88;
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column !important;
            }

            .sidebar {
                width: 100% !important;
                border-right: none !important;
                border-bottom: 2px solid #00f3ff !important;
                padding: 20px !important;
            }

            .sidebar ul {
                display: flex !important;
                flex-wrap: wrap !important;
                justify-content: space-around !important;
                gap: 10px !important;
            }

            .dashboard {
                width: 100% !important;
                padding: 20px !important;
            }

            .stats-grid {
                display: flex !important;
                flex-direction: column !important;
            }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <h2>CRYPT // SYSTEM</h2>
        <ul>
            <li>> Vue d'ensemble</li>
            <li>> Flux Llink</li>
            <li>> Nœuds ClassNet</li>
            <li>> Stocks SokoMaster</li>
        </ul>
    </aside>

    <main class="dashboard">
        <div class="dashboard-header">
            <h1>MONITORING PRODUITS CRYPT</h1>
            <p>Supervision des performances applicatives en temps réel.</p>
        </div>

        <div class="stats-grid">
            <div class="neon-box">
                <h3>Utilisateurs Llink</h3>
                <div class="data">1,024</div>
            </div>
            
            <div class="neon-box purple">
                <h3>Écoles sur ClassNet</h3>
                <div class="data">18</div>
            </div>

            <div class="neon-box green">
                <h3>Stocks SokoMaster</h3>
                <div class="data">4,850</div>
            </div>
        </div>
    </main>

</body>
</html>
